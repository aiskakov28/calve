# Calve test cluster.
#
# Catalogs are added one at a time, each with its smoke test passing before
# the next is added.
#
#   reference   http://localhost:8181
#   lakekeeper  http://localhost:8182/catalog  (--warehouse calve, after
#               "docker compose run --rm lakekeeper-init")
#   nessie      http://localhost:8183/iceberg
#   polaris     http://localhost:8184/api/catalog  (--warehouse calve and an
#               OAuth token, after "docker compose run --rm polaris-init")
#   gravitino   http://localhost:8185/iceberg
#
# Through Toxiproxy (network faults): reference :28181, lakekeeper :28182,
# nessie :28183, polaris :28184, gravitino :28185, same paths. Toxiproxy API: http://localhost:8474
#
# Every published port is bound to 127.0.0.1. The catalogs run without
# authentication or with test-only credentials, so keep them off the network.

services:
  # The Iceberg project's reference REST catalog (RESTCatalogServlet).
  # Pinned to the version apache/iceberg #18552 was reported against.
  rest-fixture:
    image: apache/iceberg-rest-fixture:1.10.1
    # WAL lets readers and writers share the SQLite file, as the fixture does by
    # default since apache/iceberg#18044. Without it, concurrent clients can get
    # SQLITE_BUSY ("database is locked").
    environment:
      CATALOG_URI: jdbc:sqlite:/tmp/iceberg_catalog.db?journal_mode=WAL
    ports:
      - "127.0.0.1:8181:8181"

  # Lakekeeper, backed by Postgres, with table files in Silo (S3-compatible).
  # Adapted from lakekeeper/lakekeeper examples/minimal. Authentication is off.
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.2
    command: ["serve"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: calve-test-only
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      silo-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8182:8181"

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    command: ["migrate"]
    environment: *lakekeeper-env
    restart: "no"
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  lakekeeper-db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Bootstraps Lakekeeper and creates the "calve" warehouse. Safe to re-run:
  # "already bootstrapped" counts as success and an existing warehouse is kept.
  # Not started by "up" (whose --wait fails on a finished one-shot job with no
  # dependents); run it with "docker compose run --rm lakekeeper-init".
  lakekeeper-init:
    image: curlimages/curl:8.16.0
    profiles: ["setup"]
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        post() {
          code=$$(curl -s -o /tmp/body -w '%{http_code}' -X POST "http://lakekeeper:8181/management/v1/$$1" \
            -H 'Content-Type: application/json' --data "$$2")
          echo "$$1: $$code $$(cat /tmp/body)"
          # A non-2xx answer is accepted only if its body names the error in $$3.
          case "$$code" in 2*) ;; *) [ -n "$$3" ] && grep -q "$$3" /tmp/body || exit 1 ;; esac
        }
        post bootstrap '{"accept-terms-of-use": true}' CatalogAlreadyBootstrapped
        if curl -sf http://lakekeeper:8181/management/v1/warehouse | grep -q '"name":"calve"'; then
          echo "warehouse calve exists"
          exit 0
        fi
        post warehouse '{
          "warehouse-name": "calve",
          "storage-profile": {
            "type": "s3", "bucket": "calve", "key-prefix": "lakekeeper",
            "endpoint": "http://silo:9000", "region": "local-01",
            "path-style-access": true, "flavor": "s3-compat", "sts-enabled": false
          },
          "storage-credential": {
            "type": "s3", "credential-type": "access-key",
            "aws-access-key-id": "calve", "aws-secret-access-key": "calve-password"
          }
        }'

  # Nessie, backed by Postgres, with table files in Silo. Adapted from
  # projectnessie/nessie docker/catalog-auth-s3, without authentication.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    environment:
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://nessie-db:5432/postgres
      quarkus.datasource.postgresql.username: postgres
      quarkus.datasource.postgresql.password: postgres
      nessie.catalog.default-warehouse: calve
      nessie.catalog.warehouses.calve.location: s3://calve/nessie/
      nessie.catalog.service.s3.default-options.endpoint: http://silo:9000/
      nessie.catalog.service.s3.default-options.region: local-01
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: calve
      nessie.catalog.secrets.access-key.secret: calve-password
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      nessie-db:
        condition: service_healthy
      silo-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8183:19120"

  nessie-db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Apache Polaris, backed by Postgres, with table files in Silo. Adapted from
  # apache/polaris getting-started. Clients need an OAuth token for the root
  # principal (root / calve-secret); see polaris-init and the README.
  polaris:
    image: apache/polaris:1.8.0
    environment: &polaris-env
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # A fixed signing key keeps tokens valid across the restarts process faults
      # cause; the default key pair is regenerated on every start.
      POLARIS_AUTHENTICATION_TOKEN_BROKER_TYPE: symmetric-key
      POLARIS_AUTHENTICATION_TOKEN_BROKER_SYMMETRIC_KEY_SECRET: calve-test-only-token-signing-key
      # Polaris writes metadata to Silo with these; no STS, no vended credentials.
      AWS_REGION: local-01
      AWS_ACCESS_KEY_ID: calve
      AWS_SECRET_ACCESS_KEY: calve-password
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      silo-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8184:8181"

  # Creates the "calve" catalog with its table files in Silo. Safe to re-run: an
  # existing catalog is kept. Like lakekeeper-init, run it with
  # "docker compose run --rm polaris-init".
  polaris-init:
    image: curlimages/curl:8.16.0
    profiles: ["setup"]
    restart: "no"
    depends_on:
      polaris:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        token=$$(curl -sf -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -d grant_type=client_credentials -d client_id=root -d client_secret=calve-secret -d scope=PRINCIPAL_ROLE:ALL \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$$token" ] || { echo "no token for the root principal"; exit 1; }
        code=$$(curl -s -o /tmp/body -w '%{http_code}' -H "Authorization: Bearer $$token" \
          http://polaris:8181/api/management/v1/catalogs/calve)
        case "$$code" in
          200) echo "catalog calve exists"; exit 0 ;;
          404) ;;
          *) echo "get catalog: $$code $$(cat /tmp/body)"; exit 1 ;;
        esac
        code=$$(curl -s -o /tmp/body -w '%{http_code}' -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' --data '{
            "catalog": {
              "name": "calve", "type": "INTERNAL",
              "properties": {"default-base-location": "s3://calve/polaris"},
              "storageConfigInfo": {
                "storageType": "S3", "allowedLocations": ["s3://calve/polaris"],
                "endpoint": "http://silo:9000", "endpointInternal": "http://silo:9000",
                "pathStyleAccess": true, "stsUnavailable": true, "region": "local-01"
              }
            }
          }')
        echo "create catalog: $$code $$(cat /tmp/body)"
        [ "$$code" = 201 ]

  # Creates the POLARIS realm and the root principal's credentials.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,calve-secret"]
    environment: *polaris-env
    restart: "no"
    depends_on:
      polaris-db:
        condition: service_healthy

  # Polaris 1.8 expects its schema to exist before bootstrap.
  polaris-db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
    configs:
      - source: polaris-schema
        target: /docker-entrypoint-initdb.d/polaris-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d POLARIS"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Apache Gravitino's standalone Iceberg REST server, backed by Postgres through
  # Iceberg's JDBC catalog, with table files in Silo. Its image ships no
  # Postgres driver, so the build adds the pinned jar, checked against its
  # SHA-256 (Maven Central's SHA-1 for it is 67f8093e...3d17); the server runs
  # as a non-root user, hence the mode. It has no multi-table transaction
  # endpoint: /v1/config does not list one and the route answers 404.
  gravitino:
    image: calve-gravitino-iceberg-rest:1.3.1
    build:
      dockerfile_inline: |
        FROM apache/gravitino-iceberg-rest:1.3.1
        ADD --checksum=sha256:157963d60ae66d607e09466e8c0cdf8087e9cb20d0159899ffca96bca2528460 --chmod=644 \
          https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar \
          /opt/gravitino-iceberg-rest-server/libs/postgresql-42.7.7.jar
    environment:
      GRAVITINO_ICEBERG_REST_CATALOG_BACKEND: jdbc
      GRAVITINO_ICEBERG_REST_URI: jdbc:postgresql://gravitino-db:5432/postgres
      GRAVITINO_ICEBERG_REST_JDBC_DRIVER: org.postgresql.Driver
      GRAVITINO_ICEBERG_REST_JDBC_USER: postgres
      GRAVITINO_ICEBERG_REST_JDBC_PASSWORD: postgres
      GRAVITINO_ICEBERG_REST_WAREHOUSE: s3://calve/gravitino
      GRAVITINO_ICEBERG_REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      GRAVITINO_ICEBERG_REST_S3_ENDPOINT: http://silo:9000
      GRAVITINO_ICEBERG_REST_S3_REGION: local-01
      GRAVITINO_ICEBERG_REST_S3_PATH_STYLE_ACCESS: "true"
      GRAVITINO_ICEBERG_REST_S3_ACCESS_KEY: calve
      GRAVITINO_ICEBERG_REST_S3_SECRET_KEY: calve-password
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/iceberg/v1/config"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      gravitino-db:
        condition: service_healthy
      silo-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8185:9001"

  gravitino-db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Silo is a maintained MinIO fork; MinIO no longer publishes images.
  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data
    # Published on the loopback interface so campaigns run from the host can
    # write snapshot manifest lists (calve run --workload maintenance).
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: calve
      MINIO_ROOT_PASSWORD: calve-password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s

  silo-bucket:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: "no"
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://silo:9000 calve calve-password && mc mb --ignore-existing local/calve

  # Toxiproxy sits between Calve and each catalog for network faults (#13).
  # Point Calve at a proxy port instead of the catalog port to run under faults;
  # the API on 8474 adds and removes toxics. It has no authentication, so every
  # port is bound to loopback only.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/toxiproxy.json"]
    configs:
      - source: toxiproxy
        target: /toxiproxy.json
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:28181:28181"
      - "127.0.0.1:28182:28182"
      - "127.0.0.1:28183:28183"
      - "127.0.0.1:28184:28184"
      - "127.0.0.1:28185:28185"

configs:
  polaris-schema:
    content: |
      CREATE SCHEMA IF NOT EXISTS POLARIS_SCHEMA;
  toxiproxy:
    content: |
      [
        {"name": "reference", "listen": "0.0.0.0:28181", "upstream": "rest-fixture:8181", "enabled": true},
        {"name": "lakekeeper", "listen": "0.0.0.0:28182", "upstream": "lakekeeper:8181", "enabled": true},
        {"name": "nessie", "listen": "0.0.0.0:28183", "upstream": "nessie:19120", "enabled": true},
        {"name": "polaris", "listen": "0.0.0.0:28184", "upstream": "polaris:8181", "enabled": true},
        {"name": "gravitino", "listen": "0.0.0.0:28185", "upstream": "gravitino:9001", "enabled": true}
      ]
