name: Other problem
description: Calve crashed, failed to run, left a fault behind or did something else unexpected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Remove tokens first.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: calve version
      description: Output of `calve version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, and whether you used the Compose stack.
