name: sweep

# Sweeps on GitHub's Linux runners, one job per catalog. Dispatch it with the
# number of runs per cell and, for a fault sweep, the fault kinds (one kind per
# plan) and the plan duration; without fault kinds it is the no-fault baseline.
# A pull request that changes the sweep tooling runs one baseline pass and one
# short partition pass. Each catalog job uploads its evidence as
# sweep-<catalog>, kept for 30 days, and builds its own tables next to it: a
# full fault sweep unzips to more than a runner's free disk, so the results job
# never downloads the evidence. It joins the per-catalog tables, puts them in
# the summary and uploads them as sweep-results.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: runs per workload, catalog and fault kind
        required: true
        default: "5"
      faults:
        description: space-separated fault kinds (latency reset partition kill pause restart); empty for the baseline
        required: false
        default: ""
      duration:
        description: fault plan duration per run
        required: false
        default: 60s
  pull_request:
    paths:
      - scripts/sweep.sh
      - cmd/calve/results.go
      - .github/workflows/sweep.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        catalog: [reference, lakekeeper, nessie, polaris]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start catalogs
        run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose run --rm lakekeeper-init
      - run: docker compose run --rm polaris-init
      - name: baseline sweep
        if: github.event_name == 'pull_request' || inputs.faults == ''
        env:
          CATALOGS: ${{ matrix.catalog }}
          RUNS: ${{ inputs.runs || '1' }}
        run: bash scripts/sweep.sh "$RUNS" "results/baseline/${{ matrix.catalog }}"
      - name: fault sweep
        if: github.event_name == 'pull_request' || inputs.faults != ''
        env:
          CATALOGS: ${{ matrix.catalog }}
          RUNS: ${{ inputs.runs || '1' }}
          FAULTS: ${{ inputs.faults || 'partition' }}
          DURATION: ${{ inputs.duration || '20s' }}
        run: bash scripts/sweep.sh "$RUNS" "results/faults/${{ matrix.catalog }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.catalog }}
          path: results/
          retention-days: 30
      - name: tables
        if: always()
        run: |
          go build -o bin/calve ./cmd/calve
          for mode in baseline faults; do
            dir="results/$mode/${{ matrix.catalog }}"
            [ -d "$dir" ] || continue
            mkdir -p "tables/$mode"
            bin/calve results "$dir" > "tables/$mode/${{ matrix.catalog }}.md"
            bin/calve results --json "$dir" > "tables/$mode/${{ matrix.catalog }}.json"
            [ ! -f "$dir/exits.tsv" ] || cp "$dir/exits.tsv" "tables/$mode/${{ matrix.catalog }}-exits.tsv"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tables-${{ matrix.catalog }}
          path: tables/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose --profile setup logs

  results:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tables-*
          path: parts
          merge-multiple: true
      # Join the per-catalog tables per mode, in catalog order as calve results
      # sorts them.
      - name: results table
        run: |
          shopt -s nullglob
          mkdir -p tables
          for mode in baseline faults; do
            parts=(parts/$mode/*.md)
            [ "${#parts[@]}" -gt 0 ] || continue
            { head -n 2 "${parts[0]}"; for part in "${parts[@]}"; do tail -n +3 "$part"; done; } > "tables/$mode.md"
            jq -s add parts/$mode/*.json > "tables/$mode.json"
            exits=(parts/$mode/*-exits.tsv)
            [ "${#exits[@]}" = 0 ] || cat "${exits[@]}" > "tables/$mode-exits.tsv"
            {
              if [ "$mode" = baseline ]; then echo "## No-fault baseline sweep"; else
                echo "## Fault sweep"
                echo
                echo "One fault kind per plan. Process faults (kill, pause, restart) do not run on the reference fixture."
              fi
              echo
              cat "tables/$mode.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: tables/
