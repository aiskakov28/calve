name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # Native Windows catches path and file-URI handling that Linux cannot. It
  # runs the packages that read and write manifest files; the skew tests need
  # a finer clock than Windows gives (#95).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/storage ./cmd/calve
      - run: go test -run Snapshot ./internal/workload

  smoke:
    # Runs Calve against every catalog in docker-compose.yml.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o calve ./cmd/calve
      # The README's one-command setup, from scratch: catalogs, setup jobs and
      # a smoke test of each.
      - name: start catalogs
        run: bash scripts/up.sh
      # Polaris needs an OAuth token for its root principal. It stays out of
      # CALVE_TOKEN so the other catalogs get no Authorization header.
      - name: polaris token
        run: |
          token=$(curl -sf -X POST http://localhost:8184/api/catalog/v1/oauth/tokens \
            -d grant_type=client_credentials -d client_id=root -d client_secret=calve-secret \
            -d scope=PRINCIPAL_ROLE:ALL | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = null ]; then echo "no Polaris token"; exit 1; fi
          echo "::add-mask::$token"
          echo "POLARIS_TOKEN=$token" >> "$GITHUB_ENV"
      # The GitHub Action as another project would use it: it must pass a
      # correct run and fail on a known finding.
      - name: action on polaris (expect valid)
        id: action-polaris
        uses: ./
        with:
          catalog: http://localhost:8184/api/catalog
          warehouse: calve
          token: ${{ env.POLARIS_TOKEN }}
          workloads: append atomic schema
          out-dir: action-polaris
      - name: action on reference skew (expect invalid)
        id: action-reference
        continue-on-error: true
        uses: ./
        with:
          catalog: http://localhost:8181
          workloads: skew
          out-dir: action-reference
      - name: action verdicts
        env:
          POLARIS_VERDICT: ${{ steps.action-polaris.outputs.verdict }}
          REFERENCE_OUTCOME: ${{ steps.action-reference.outcome }}
          REFERENCE_VERDICT: ${{ steps.action-reference.outputs.verdict }}
        run: |
          echo "polaris: $POLARIS_VERDICT; reference: $REFERENCE_OUTCOME, $REFERENCE_VERDICT"
          [ "$POLARIS_VERDICT" = valid ]
          [ "$REFERENCE_OUTCOME" = failure ] && [ "$REFERENCE_VERDICT" = invalid ]
      - run: ./calve append --catalog http://localhost:8181 --clients 8 --per-client 25
      # The skew gate: the reference catalog has apache/iceberg #18552, so the
      # checker must report write skew there (exit 3) and nothing elsewhere.
      # Fails if the checker stops catching the known bug or flags a correct catalog.
      # The barrier does not guarantee overlap, so reference gets 30 rounds and up
      # to 3 attempts before a run without write skew counts as a failure.
      - name: skew gate reference (expect invalid)
        run: |
          set -o pipefail # Actions' default bash -e does not set it; keep calve's exit code through tee
          for attempt in 1 2 3; do
            code=0
            ./calve skew --catalog http://localhost:8181 --rounds 30 --out "history-skew-reference-$attempt.jsonl" | tee skew-reference.txt || code=$?
            case "$code" in
              3) grep -q '^INVALID: .*write-skew' skew-reference.txt && exit 0
                 echo "invalid without a write-skew finding"; exit 1 ;;
              0|4) echo "attempt $attempt: no write skew (exit $code)" ;;
              *) exit "$code" ;;
            esac
          done
          exit 1
      - name: skew gate lakekeeper (expect valid)
        run: ./calve skew --catalog http://localhost:8182/catalog --warehouse calve --out history-skew-lakekeeper.jsonl
      - name: skew gate nessie (expect valid)
        run: ./calve skew --catalog http://localhost:8183/iceberg --out history-skew-nessie.jsonl
      # Polaris has the known write-skew bug apache/polaris#5807
      # (docs/triage-polaris-skew.md). This fails once a pinned release fixes it,
      # so the gate and the note get updated.
      - name: skew gate polaris (expect invalid until apache/polaris#5807 is fixed)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            code=0
            ./calve skew --catalog http://localhost:8184/api/catalog --warehouse calve --token "$POLARIS_TOKEN" \
              --rounds 10 --out "history-skew-polaris-$attempt.jsonl" | tee skew-polaris.txt || code=$?
            case "$code" in
              3) grep -q '^INVALID: .*write-skew' skew-polaris.txt && exit 0
                 echo "invalid without a write-skew finding"; exit 1 ;;
              0|4) echo "attempt $attempt: no write skew (exit $code)" ;;
              *) exit "$code" ;;
            esac
          done
          echo "no write skew on Polaris in 3 attempts: if apache/polaris#5807 is fixed, update this gate"
          exit 1
      - name: smoke through toxiproxy
        run: |
          ./calve smoke --catalog http://localhost:28181
          ./calve smoke --catalog http://localhost:28182/catalog --warehouse calve
          ./calve smoke --catalog http://localhost:28183/iceberg
          ./calve smoke --catalog http://localhost:28184/api/catalog --warehouse calve --token "$POLARIS_TOKEN"
      - name: multi-table effects and offline replay
        run: |
          set -o pipefail
          run_atomic() {
            local name="$1" catalog="$2" warehouse="$3" token="$4"
            local code=0 checked=0
            local log="atomic-$name.log"
            ./calve atomic --catalog "$catalog" --warehouse "$warehouse" --token "$token" \
              --tables 2 --clients 2 --per-client 10 --readers 1 --read-interval 10ms \
              --timeout 5s --out "history-atomic-$name.jsonl" | tee "$log" || code=$?
            case "$code" in 0|4) ;; *) exit "$code" ;; esac
            if ! grep -Eq '^multi-table atomic: [1-9][0-9]* ok,|^multi-table atomic: .* \([1-9][0-9]* resolved as committed\);' "$log"; then
              echo "no proven committed atomic coverage on $name"; exit 1
            fi
            if ! grep -Eq '^workload reads: .*; [1-9][0-9]* usable during transactions$' "$log"; then
              echo "no usable concurrent reader coverage on $name"; exit 1
            fi
            ./calve check "history-atomic-$name.jsonl" || checked=$?
            if [ "$checked" != "$code" ]; then echo "atomic replay disagrees on $name"; exit 1; fi
          }
          # Reference has a separate missing-marker lead; see its triage note.
          # Require commit coverage; unknown peers may remain inconclusive.
          run_atomic lakekeeper http://localhost:8182/catalog calve ""
          run_atomic nessie http://localhost:8183/iceberg "" ""
          run_atomic polaris http://localhost:8184/api/catalog calve "$POLARIS_TOKEN"
      - name: schema compare-and-set and offline replay
        run: |
          set -o pipefail
          run_schema() {
            local name="$1" catalog="$2" warehouse="$3" token="$4"
            local code=0 checked=0
            local log="schema-$name.log"
            ./calve schema --catalog "$catalog" --warehouse "$warehouse" --token "$token" \
              --clients 4 --rounds 5 --timeout 5s --out "history-schema-$name.jsonl" | tee "$log" || code=$?
            case "$code" in 0|4) ;; *) exit "$code" ;; esac
            if ! grep -Eq '^schema CAS: [0-9]+ rounds, [1-9][0-9]* with a winner;' "$log"; then
              echo "no committed schema round on $name"; exit 1
            fi
            ./calve check "history-schema-$name.jsonl" || checked=$?
            if [ "$checked" != "$code" ]; then echo "schema replay disagrees on $name"; exit 1; fi
          }
          # Lakekeeper answers losing schema commits with 503, so it stays
          # inconclusive; see docs/schema-workload.md.
          run_schema reference http://localhost:8181 "" ""
          run_schema lakekeeper http://localhost:8182/catalog calve ""
          run_schema nessie http://localhost:8183/iceberg "" ""
          run_schema polaris http://localhost:8184/api/catalog calve "$POLARIS_TOKEN"
      - name: toxiproxy faults take effect and heal
        env:
          CALVE_TOXIPROXY: http://localhost:8474
        run: go test -race -count=1 -run 'ToxiproxyLive' -v ./internal/fault
      # Process fault checks follow the concurrency gates above.
      - name: process faults take effect, heal, and keep catalog data
        env:
          CALVE_DOCKER_FAULTS: "1"
        run: go test -race -count=1 -run 'DockerLive' -v ./internal/fault
      # A seeded campaign on Lakekeeper (seed 7: a restart, then a partition) while
      # clients append. Under faults 0 (valid) or 4 (inconclusive) is expected; 3 is a
      # finding to triage and 1 a broken run. calve check must agree offline.
      - name: fault campaign lakekeeper
        run: |
          code=0
          ./calve run --seed 7 --targets lakekeeper --catalog http://localhost:28182/catalog --warehouse calve \
            --duration 30s --timeout 5s --out-dir runs/lakekeeper-seed-7 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/lakekeeper-seed-7 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # Maintenance under network and process faults on Lakekeeper, where its
      # fault-free baseline is valid. Manifests go to Silo's loopback port.
      - name: maintenance fault campaign lakekeeper
        env:
          AWS_ACCESS_KEY_ID: calve
          AWS_SECRET_ACCESS_KEY: calve-password
        run: |
          code=0
          ./calve run --workload maintenance --seed 7 --targets lakekeeper \
            --catalog http://localhost:28182/catalog --warehouse calve \
            --s3-endpoint http://localhost:19000 --s3-region local-01 \
            --duration 30s --timeout 5s --out-dir runs/lakekeeper-maintenance-seed-7 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/lakekeeper-maintenance-seed-7 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # Snapshot under network faults on Polaris; Lakekeeper already gets
      # process faults above. Manifests go to Silo's loopback port.
      - name: snapshot fault campaign polaris
        env:
          AWS_ACCESS_KEY_ID: calve
          AWS_SECRET_ACCESS_KEY: calve-password
        run: |
          code=0
          ./calve run --workload snapshot --seed 3 --targets polaris --faults latency,reset,partition \
            --catalog http://localhost:28184/api/catalog --warehouse calve --token "$POLARIS_TOKEN" \
            --s3-endpoint http://localhost:19000 --s3-region local-01 \
            --duration 30s --timeout 5s --out-dir runs/polaris-snapshot-seed-3 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/polaris-snapshot-seed-3 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # Multi-table transactions under network faults on Polaris.
      - name: atomic fault campaign polaris
        run: |
          code=0
          ./calve run --workload atomic --seed 3 --targets polaris --faults latency,reset,partition \
            --catalog http://localhost:28184/api/catalog --warehouse calve --token "$POLARIS_TOKEN" \
            --duration 30s --timeout 5s --out-dir runs/polaris-atomic-seed-3 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/polaris-atomic-seed-3 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # The schema workload under network faults on Polaris, where its
      # fault-free baseline is valid. calve check must agree offline.
      - name: schema fault campaign polaris
        run: |
          code=0
          ./calve run --workload schema --seed 3 --targets polaris --faults latency,reset,partition \
            --catalog http://localhost:28184/api/catalog --warehouse calve --token "$POLARIS_TOKEN" \
            --duration 30s --timeout 5s --out-dir runs/polaris-schema-seed-3 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/polaris-schema-seed-3 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # Skew under network and process faults on Lakekeeper, where its
      # fault-free baseline is valid (Polaris shows write skew, apache/polaris#5807).
      - name: skew fault campaign lakekeeper
        run: |
          code=0
          ./calve run --workload skew --seed 7 --targets lakekeeper --catalog http://localhost:28182/catalog --warehouse calve \
            --duration 30s --timeout 5s --out-dir runs/lakekeeper-skew-seed-7 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/lakekeeper-skew-seed-7 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      # One appender and an occasional expiration; low contention, so it runs
      # before the snapshot step, which can leave the reference fixture locked.
      - name: maintenance race and offline replay on all catalogs
        run: |
          CGO_ENABLED=0 go build -o bin/calve-snapshot ./cmd/calve
          bash scripts/check-maintenance.sh
      # Snapshot contention can leave the reference fixture's SQLite connections
      # locked. Keep this last so it cannot break setup for unrelated checks.
      - name: snapshot workload and offline replay on all catalogs
        run: |
          CGO_ENABLED=0 go build -o bin/calve-snapshot ./cmd/calve
          bash scripts/check-snapshots.sh
      - if: failure()
        run: docker compose --profile setup logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: |
            history*.jsonl
            snapshot-*.log
            schema-*.log
            maintenance-*.log
            runs/
