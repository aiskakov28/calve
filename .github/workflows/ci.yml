name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  smoke:
    # Runs Calve against every catalog in docker-compose.yml.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o calve ./cmd/calve
      - name: start catalogs
        run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose run --rm lakekeeper-init
      - name: smoke reference
        run: ./calve smoke --catalog http://localhost:8181
      - name: smoke lakekeeper
        run: ./calve smoke --catalog http://localhost:8182/catalog --warehouse calve
      - name: smoke nessie
        run: ./calve smoke --catalog http://localhost:8183/iceberg
      # Polaris needs an OAuth token for its root principal. It stays out of
      # CALVE_TOKEN so the other catalogs get no Authorization header.
      - name: polaris catalog and token
        run: |
          docker compose run --rm polaris-init
          token=$(curl -sf -X POST http://localhost:8184/api/catalog/v1/oauth/tokens \
            -d grant_type=client_credentials -d client_id=root -d client_secret=calve-secret \
            -d scope=PRINCIPAL_ROLE:ALL | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = null ]; then echo "no Polaris token"; exit 1; fi
          echo "::add-mask::$token"
          echo "POLARIS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: smoke polaris
        run: ./calve smoke --catalog http://localhost:8184/api/catalog --warehouse calve --token "$POLARIS_TOKEN"
      - run: ./calve append --catalog http://localhost:8181 --clients 8 --per-client 25
      # The skew gate: the reference catalog has apache/iceberg #18552, so the
      # checker must report write skew there (exit 3) and nothing elsewhere.
      # Fails if the checker stops catching the known bug or flags a correct catalog.
      # The barrier does not guarantee overlap, so reference gets 30 rounds and up
      # to 3 attempts before a run without write skew counts as a failure.
      - name: skew gate reference (expect invalid)
        run: |
          set -o pipefail # Actions' default bash -e does not set it; keep calve's exit code through tee
          for attempt in 1 2 3; do
            code=0
            ./calve skew --catalog http://localhost:8181 --rounds 30 --out "history-skew-reference-$attempt.jsonl" | tee skew-reference.txt || code=$?
            case "$code" in
              3) grep -q '^INVALID: .*write-skew' skew-reference.txt && exit 0
                 echo "invalid without a write-skew finding"; exit 1 ;;
              0|4) echo "attempt $attempt: no write skew (exit $code)" ;;
              *) exit "$code" ;;
            esac
          done
          exit 1
      - name: skew gate lakekeeper (expect valid)
        run: ./calve skew --catalog http://localhost:8182/catalog --warehouse calve --out history-skew-lakekeeper.jsonl
      - name: skew gate nessie (expect valid)
        run: ./calve skew --catalog http://localhost:8183/iceberg --out history-skew-nessie.jsonl
      # Polaris has the known write-skew bug apache/polaris#5807
      # (docs/triage-polaris-skew.md). This fails once a pinned release fixes it,
      # so the gate and the note get updated.
      - name: skew gate polaris (expect invalid until apache/polaris#5807 is fixed)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            code=0
            ./calve skew --catalog http://localhost:8184/api/catalog --warehouse calve --token "$POLARIS_TOKEN" \
              --rounds 10 --out "history-skew-polaris-$attempt.jsonl" | tee skew-polaris.txt || code=$?
            case "$code" in
              3) grep -q '^INVALID: .*write-skew' skew-polaris.txt && exit 0
                 echo "invalid without a write-skew finding"; exit 1 ;;
              0|4) echo "attempt $attempt: no write skew (exit $code)" ;;
              *) exit "$code" ;;
            esac
          done
          echo "no write skew on Polaris in 3 attempts: if apache/polaris#5807 is fixed, update this gate"
          exit 1
      - name: smoke through toxiproxy
        run: |
          ./calve smoke --catalog http://localhost:28181
          ./calve smoke --catalog http://localhost:28182/catalog --warehouse calve
          ./calve smoke --catalog http://localhost:28183/iceberg
          ./calve smoke --catalog http://localhost:28184/api/catalog --warehouse calve --token "$POLARIS_TOKEN"
      - name: multi-table effects and offline replay
        run: |
          set -o pipefail
          run_atomic() {
            local name="$1" catalog="$2" warehouse="$3" token="$4"
            local code=0 checked=0
            local log="atomic-$name.log"
            ./calve atomic --catalog "$catalog" --warehouse "$warehouse" --token "$token" \
              --tables 2 --clients 2 --per-client 3 --timeout 5s --out "history-atomic-$name.jsonl" | tee "$log" || code=$?
            case "$code" in 0|4) ;; *) exit "$code" ;; esac
            if ! grep -Eq '^multi-table atomic: [1-9][0-9]* ok,|^multi-table atomic: .* \([1-9][0-9]* resolved as committed\);' "$log"; then
              echo "no proven committed atomic coverage on $name"; exit 1
            fi
            ./calve check "history-atomic-$name.jsonl" || checked=$?
            if [ "$checked" != "$code" ]; then echo "atomic replay disagrees on $name"; exit 1; fi
          }
          # Reference has a separate missing-marker lead; see its triage note.
          # Require commit coverage; unknown peers may remain inconclusive.
          run_atomic lakekeeper http://localhost:8182/catalog calve ""
          run_atomic nessie http://localhost:8183/iceberg "" ""
          run_atomic polaris http://localhost:8184/api/catalog calve "$POLARIS_TOKEN"
      - name: toxiproxy faults take effect and heal
        env:
          CALVE_TOXIPROXY: http://localhost:8474
        run: go test -race -count=1 -run 'ToxiproxyLive' -v ./internal/fault
      # These two steps kill, pause and restart the catalogs, so they run last.
      - name: process faults take effect, heal, and keep catalog data
        env:
          CALVE_DOCKER_FAULTS: "1"
        run: go test -race -count=1 -run 'DockerLive' -v ./internal/fault
      # A seeded campaign on Lakekeeper (seed 7: a restart, then a partition) while
      # clients append. Under faults 0 (valid) or 4 (inconclusive) is expected; 3 is a
      # finding to triage and 1 a broken run. calve check must agree offline.
      - name: fault campaign lakekeeper
        run: |
          code=0
          ./calve run --seed 7 --targets lakekeeper --catalog http://localhost:28182/catalog --warehouse calve \
            --duration 30s --timeout 5s --out-dir runs/lakekeeper-seed-7 || code=$?
          case "$code" in 0|4) ;; *) exit "$code" ;; esac
          checked=0
          ./calve check runs/lakekeeper-seed-7 || checked=$?
          if [ "$checked" != "$code" ]; then echo "calve check exit $checked, run exit $code"; exit 1; fi
      - if: failure()
        run: docker compose --profile setup logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: |
            history*.jsonl
            runs/
