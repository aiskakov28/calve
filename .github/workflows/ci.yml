name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  smoke:
    # Runs Calve against every catalog in docker-compose.yml.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o calve ./cmd/calve
      - name: start catalogs
        run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose run --rm lakekeeper-init
      - name: smoke reference
        run: ./calve smoke --catalog http://localhost:8181
      - name: smoke lakekeeper
        run: ./calve smoke --catalog http://localhost:8182/catalog --warehouse calve
      - name: smoke nessie
        run: ./calve smoke --catalog http://localhost:8183/iceberg
      - run: ./calve append --catalog http://localhost:8181 --clients 8 --per-client 25
      # The skew gate: the reference catalog has apache/iceberg #18552, so the
      # checker must report write skew there (exit 3) and nothing elsewhere.
      # Fails if the checker stops catching the known bug or flags a correct catalog.
      # The barrier does not guarantee overlap, so reference gets 30 rounds and up
      # to 3 attempts before a run without write skew counts as a failure.
      - name: skew gate reference (expect invalid)
        run: |
          set -o pipefail # Actions' default bash -e does not set it; keep calve's exit code through tee
          for attempt in 1 2 3; do
            code=0
            ./calve skew --catalog http://localhost:8181 --rounds 30 --out "history-skew-reference-$attempt.jsonl" | tee skew-reference.txt || code=$?
            case "$code" in
              3) grep -q '^INVALID: .*write-skew' skew-reference.txt && exit 0
                 echo "invalid without a write-skew finding"; exit 1 ;;
              0|4) echo "attempt $attempt: no write skew (exit $code)" ;;
              *) exit "$code" ;;
            esac
          done
          exit 1
      - name: skew gate lakekeeper (expect valid)
        run: ./calve skew --catalog http://localhost:8182/catalog --warehouse calve --out history-skew-lakekeeper.jsonl
      - name: skew gate nessie (expect valid)
        run: ./calve skew --catalog http://localhost:8183/iceberg --out history-skew-nessie.jsonl
      - name: smoke through toxiproxy
        run: |
          ./calve smoke --catalog http://localhost:28181
          ./calve smoke --catalog http://localhost:28182/catalog --warehouse calve
          ./calve smoke --catalog http://localhost:28183/iceberg
      - name: toxiproxy faults take effect and heal
        env:
          CALVE_TOXIPROXY: http://localhost:8474
        run: go test -race -count=1 -run 'ToxiproxyLive' -v ./internal/fault
      - if: failure()
        run: docker compose --profile setup logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: history*.jsonl
