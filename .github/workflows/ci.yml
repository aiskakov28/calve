name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  smoke:
    # Runs Calve against the real reference catalog in Docker.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose up -d
      - name: wait for catalog
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8181/v1/config && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: go run ./cmd/calve smoke --catalog http://localhost:8181
      - run: go run ./cmd/calve append --catalog http://localhost:8181 --clients 8 --per-client 25
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: history.jsonl
