name: Calve catalog check
description: Run Calve's concurrency workloads against an Iceberg REST catalog and fail on a correctness anomaly.
inputs:
  catalog:
    description: REST URL of the catalog under test, which must already be running
    required: true
  warehouse:
    description: warehouse name, if the catalog needs one
    required: false
    default: ""
  token:
    description: bearer token, if the catalog needs one (pass it from a secret)
    required: false
    default: ""
  workloads:
    description: space-separated workloads from append, skew, atomic and schema
    required: false
    default: append skew atomic schema
  fail-on:
    description: invalid fails only on a finding; inconclusive also fails when a run cannot be decided
    required: false
    default: invalid
  out-dir:
    description: new or empty directory for the histories and logs, relative to the workspace
    required: false
    default: calve-results
outputs:
  verdict:
    description: the worst verdict across the workloads (valid, inconclusive, error or invalid)
    value: ${{ steps.check.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: build calve
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/calve" ./cmd/calve
    - id: check
      name: check the catalog
      shell: bash
      env:
        CALVE: ${{ runner.temp }}/calve
        CATALOG: ${{ inputs.catalog }}
        WAREHOUSE: ${{ inputs.warehouse }}
        CALVE_TOKEN: ${{ inputs.token }}
        WORKLOADS: ${{ inputs.workloads }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUT: ${{ inputs.out-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check-catalog.sh"
